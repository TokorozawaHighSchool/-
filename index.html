<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>すごろくゲーム</title>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <div id="game-container">
        <h1>すごろくゲーム</h1>
        <div id="setup-container">
            <h2>モード・人数選択</h2>
            <form id="setup-form">
                <label>モード:
                    <select id="mode-select">
                        <option value="cpu">CPU対戦</option>
                        <option value="pvp">対人戦</option>
                    </select>
                </label>
                <br>
                <label>遊ぶ人数:
                    <select id="player-count-select">
                        <option value="2">2人</option>
                        <option value="3">3人</option>
                        <option value="4">4人</option>
                    </select>
                </label>
                <br>
                <label>CPU人数:
                    <select id="cpu-count-select">
                        <option value="0">0人</option>
                        <option value="1">1人</option>
                        <option value="2">2人</option>
                        <option value="3">3人</option>
                    </select>
                </label>
                <br>
                <button type="submit">ゲーム開始</button>
            </form>
        </div>
        <div id="board">
            <!-- ゲームボードの要素をここに追加 -->
        </div>
        <div id="player-info">
            <h2>プレイヤー情報</h2>
            <!-- プレイヤーの情報をここに表示 -->
        </div>
            <button id="roll-button">
                <div id="dice" class="dice">🎲</div>
                <span class="dice-label">サイコロを振る</span>
            </button>
        <button id="use-item-button" class="choice-btn" style="margin-left:12px">アイテムを使う</button>
        <div id="result"></div>
        <div id="overlay-message"></div>
        <div id="choice-modal" class="modal" style="display:none">
            <div class="modal-content">
                <div id="choice-text"></div>
                <div id="choice-buttons"></div>
            </div>
        </div>
        <div id="item-modal" class="modal" style="display:none">
            <div class="modal-content">
                <h3>所持アイテム</h3>
                <div id="item-list"></div>
                <div style="margin-top:12px"><button id="close-item-modal" class="choice-btn">閉じる</button></div>
            </div>
        </div>
        <div id="target-modal" class="modal" style="display:none">
            <div class="modal-content">
                <h3>妨害対象を選んでください</h3>
                <div id="target-list"></div>
                <div style="margin-top:12px"><button id="close-target-modal" class="choice-btn">キャンセル</button></div>
            </div>
        </div>
    </div>
    <script src="src/main.js"></script>
</body>
</html>
